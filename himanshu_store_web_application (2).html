<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HIMANSHU STORE - Talwana, Rajasthan</title>
  
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- React 18 & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel Standalone CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f3f6;
    }
    .brand-font {
      font-family: 'Outfit', sans-serif;
    }
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    .badge-pulse {
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .6; }
    }
  </style>
</head>
<body class="text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

  <!-- React Mount Point -->
  <div id="root"></div>

  <!-- Main React Web Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // --- Inline SVG Icon Components ---
    const Icon = ({ name, className = "w-5 h-5" }) => {
      const icons = {
        shoppingBag: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />,
        shoppingCart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z" />,
        heart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />,
        solidHeart: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" fill="currentColor" />,
        user: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />,
        shield: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />,
        search: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />,
        trash: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
        plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
        camera: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9zM15 13a3 3 0 11-6 0 3 3 0 016 0z" />,
        check: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" />,
        phone: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />,
        mapPin: <g><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></g>,
        star: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" />,
        lock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />,
        logout: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />,
        x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
        whatsapp: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />,
        tag: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />,
        orders: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />,
        arrowRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
      };
      return (
        <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
          {icons[name] || null}
        </svg>
      );
    };

    const SAMPLE_PRODUCTS = [
      {
        id: 'p1',
        title: 'Fortune Sunlite Refined Sunflower Oil',
        category: 'Grocery & Cooking',
        weight: '1 Litre',
        mrp: 185,
        price: 145,
        stock: 25,
        rating: 4.9,
        image: 'https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=500&auto=format&fit=crop&q=80'
      },
      {
        id: 'p2',
        title: 'Aashirvaad Shuddh Chakki Atta',
        category: 'Grocery & Cooking',
        weight: '5 kg',
        mrp: 290,
        price: 240,
        stock: 40,
        rating: 4.8,
        image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?w=500&auto=format&fit=crop&q=80'
      },
      {
        id: 'p3',
        title: 'Tata Sampann Unpolished Toor Dal',
        category: 'Grocery & Cooking',
        weight: '1 kg',
        mrp: 175,
        price: 138,
        stock: 30,
        rating: 4.9,
        image: 'https://images.unsplash.com/photo-1585992629288-80126c513f5a?w=500&auto=format&fit=crop&q=80'
      },
      {
        id: 'p4',
        title: 'Cadbury Dairy Milk Silk Chocolate',
        category: 'Snacks & Sweets',
        weight: '150 g',
        mrp: 180,
        price: 155,
        stock: 50,
        rating: 5.0,
        image: 'https://images.unsplash.com/photo-1548907040-4baa42d10919?w=500&auto=format&fit=crop&q=80'
      }
    ];

    // Main React Application
    function App() {
      const [products, setProducts] = useState(() => {
        const saved = localStorage.getItem('himanshu_products');
        return saved ? JSON.parse(saved) : SAMPLE_PRODUCTS;
      });

      const [registeredUsers, setRegisteredUsers] = useState(() => {
        const saved = localStorage.getItem('himanshu_registered_users');
        return saved ? JSON.parse(saved) : [
          {
            id: 'u1',
            name: 'Himanshu Sharma',
            email: 'himanshu@talwana.com',
            mobile: '9950091416',
            signupDate: '2026-02-01 10:30 AM',
            otpStatus: 'Verified'
          }
        ];
      });

      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('himanshu_current_user');
        return saved ? JSON.parse(saved) : null;
      });

      // Navigation Step for Unauthenticated User: 'landing' (Front Page) or 'auth' (Login/Signup Gate)
      const [unauthView, setUnauthView] = useState('landing');

      const [cart, setCart] = useState(() => {
        const saved = localStorage.getItem('himanshu_cart');
        return saved ? JSON.parse(saved) : [];
      });

      const [wishlist, setWishlist] = useState(() => {
        const saved = localStorage.getItem('himanshu_wishlist');
        return saved ? JSON.parse(saved) : [];
      });

      const [myOrders, setMyOrders] = useState(() => {
        const saved = localStorage.getItem('himanshu_orders');
        return saved ? JSON.parse(saved) : [];
      });

      // UI Control States
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [authTab, setAuthTab] = useState('signup'); // 'signup', 'login', 'otp'
      
      // OTP Verification State
      const [pendingSignupData, setPendingSignupData] = useState(null);
      const [generatedOtp, setGeneratedOtp] = useState('');
      const [userOtpInput, setUserOtpInput] = useState('');
      const [demoOtpToast, setDemoOtpToast] = useState(null);

      // Owner Portal State
      const [showOwnerPasscodeModal, setShowOwnerPasscodeModal] = useState(false);
      const [ownerPasscodeInput, setOwnerPasscodeInput] = useState('');
      const [isOwnerAuthenticated, setIsOwnerAuthenticated] = useState(false);
      const [showOwnerDashboard, setShowOwnerDashboard] = useState(false);
      const [ownerTab, setOwnerTab] = useState('products');

      // Drawers and Modals
      const [showCartDrawer, setShowCartDrawer] = useState(false);
      const [showWishlistModal, setShowWishlistModal] = useState(false);
      const [showOrdersModal, setShowOrdersModal] = useState(false);
      const [couponCode, setCouponCode] = useState('');
      const [appliedDiscount, setAppliedDiscount] = useState(0);

      // Toast Notification System
      const [toast, setToast] = useState(null);

      // Add Product Form State
      const [newProduct, setNewProduct] = useState({
        title: '',
        category: 'Grocery & Cooking',
        weight: '1 kg',
        mrp: '',
        price: '',
        stock: '50',
        image: ''
      });

      // Sync state with LocalStorage
      useEffect(() => {
        localStorage.setItem('himanshu_products', JSON.stringify(products));
      }, [products]);

      useEffect(() => {
        localStorage.setItem('himanshu_registered_users', JSON.stringify(registeredUsers));
      }, [registeredUsers]);

      useEffect(() => {
        localStorage.setItem('himanshu_current_user', JSON.stringify(currentUser));
      }, [currentUser]);

      useEffect(() => {
        localStorage.setItem('himanshu_cart', JSON.stringify(cart));
      }, [cart]);

      useEffect(() => {
        localStorage.setItem('himanshu_wishlist', JSON.stringify(wishlist));
      }, [wishlist]);

      useEffect(() => {
        localStorage.setItem('himanshu_orders', JSON.stringify(myOrders));
      }, [myOrders]);

      // Toast Helper Function
      const showToast = (message, type = 'info') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Handle Sign Up Form Submit -> Generates OTP
      const handleSignupSubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const name = formData.get('fullName').trim();
        const email = formData.get('email').trim();
        const mobile = formData.get('mobile').trim();
        const password = formData.get('password');
        const confirmPassword = formData.get('confirmPassword');

        if (!name || !email || !mobile || !password) {
          showToast('Please fill in all required fields!', 'error');
          return;
        }

        if (mobile.length < 10) {
          showToast('Please enter a valid 10-digit mobile number!', 'error');
          return;
        }

        if (password !== confirmPassword) {
          showToast('Passwords do not match!', 'error');
          return;
        }

        // Check if mobile already exists
        const existing = registeredUsers.find(u => u.mobile === mobile || u.email === email);
        if (existing) {
          showToast('This mobile number or email is already registered. Please log in!', 'error');
          setAuthTab('login');
          return;
        }

        // Generate 4-Digit OTP
        const otp = Math.floor(1000 + Math.random() * 9000).toString();
        setGeneratedOtp(otp);
        setPendingSignupData({
          id: 'user_' + Date.now(),
          name,
          email,
          mobile,
          password,
          signupDate: new Date().toLocaleString(),
          otpStatus: 'Verified'
        });

        // Switch view to OTP input
        setAuthTab('otp');
        setUserOtpInput('');

        // Display Demo OTP Banner
        setDemoOtpToast(`📱 DEMO OTP CODE: ${otp} (for +91 ${mobile})`);
        showToast(`OTP Code sent to +91 ${mobile}!`, 'success');
      };

      // Verify OTP Code
      const handleVerifyOtp = (e) => {
        e.preventDefault();
        if (userOtpInput.trim() === generatedOtp) {
          const updatedUsers = [...registeredUsers, pendingSignupData];
          setRegisteredUsers(updatedUsers);
          setCurrentUser(pendingSignupData);
          
          showToast(`🎉 Account Created! Welcome to Himanshu Store, ${pendingSignupData.name}!`, 'success');
          
          setPendingSignupData(null);
          setGeneratedOtp('');
          setDemoOtpToast(null);
        } else {
          showToast('Invalid OTP! Please enter the 4-digit code shown on the top banner.', 'error');
        }
      };

      // Handle Direct Login
      const handleLoginSubmit = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const identity = formData.get('identity').trim();
        const password = formData.get('password');

        const user = registeredUsers.find(u => (u.mobile === identity || u.email === identity) && u.password === password);

        if (user) {
          setCurrentUser(user);
          showToast(`Welcome back, ${user.name}!`, 'success');
        } else {
          showToast('Invalid Mobile/Email or Password! Please check your credentials.', 'error');
        }
      };

      // Handle Quick Logout
      const handleLogout = () => {
        setCurrentUser(null);
        setUnauthView('landing');
        showToast('Logged out successfully.', 'info');
      };

      // Unlock Owner Portal with passcode 9950
      const handleOwnerPasscodeSubmit = (e) => {
        e.preventDefault();
        if (ownerPasscodeInput.trim() === '9950') {
          setIsOwnerAuthenticated(true);
          setShowOwnerPasscodeModal(false);
          setShowOwnerDashboard(true);
          setOwnerPasscodeInput('');
          showToast('👑 Owner Portal Unlocked Successfully!', 'success');
        } else {
          showToast('❌ Incorrect Passcode! Access Denied.', 'error');
        }
      };

      const handleImageUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            setNewProduct(prev => ({ ...prev, image: reader.result }));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddProduct = (e) => {
        e.preventDefault();
        if (!newProduct.title || !newProduct.mrp || !newProduct.price) {
          showToast('Please enter Title, MRP, and Selling Price!', 'error');
          return;
        }

        const productItem = {
          id: 'prod_' + Date.now(),
          title: newProduct.title,
          category: newProduct.category,
          weight: newProduct.weight || '1 unit',
          mrp: parseFloat(newProduct.mrp),
          price: parseFloat(newProduct.price),
          stock: parseInt(newProduct.stock) || 50,
          rating: 4.9,
          image: newProduct.image || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=500&auto=format&fit=crop&q=80'
        };

        setProducts([productItem, ...products]);
        showToast(`✅ "${productItem.title}" added to Store Catalog!`, 'success');

        setNewProduct({
          title: '',
          category: 'Grocery & Cooking',
          weight: '1 kg',
          mrp: '',
          price: '',
          stock: '50',
          image: ''
        });
      };

      const handleDeleteProduct = (id, title) => {
        setProducts(products.filter(p => p.id !== id));
        showToast(`Item "${title}" removed from store catalog.`, 'info');
      };

      const addToCart = (product) => {
        const existingIndex = cart.findIndex(item => item.id === product.id);
        if (existingIndex > -1) {
          const updatedCart = [...cart];
          updatedCart[existingIndex].quantity += 1;
          setCart(updatedCart);
        } else {
          setCart([...cart, { ...product, quantity: 1 }]);
        }
        showToast(`Added "${product.title}" to your cart!`, 'success');
      };

      const updateCartQty = (id, delta) => {
        setCart(cart.map(item => {
          if (item.id === id) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const toggleWishlist = (productId) => {
        if (wishlist.includes(productId)) {
          setWishlist(wishlist.filter(id => id !== productId));
          showToast('Removed item from Wishlist.', 'info');
        } else {
          setWishlist([...wishlist, productId]);
          showToast('Saved to your Wishlist!', 'success');
        }
      };

      const applyCoupon = () => {
        if (couponCode.trim().toUpperCase() === 'HIMANSHU100') {
          setAppliedDiscount(100);
          showToast('🎉 Coupon "HIMANSHU100" Applied! Saved ₹100!', 'success');
        } else if (couponCode.trim().toUpperCase() === 'TALWANA50') {
          setAppliedDiscount(50);
          showToast('🎉 Coupon "TALWANA50" Applied! Saved ₹50!', 'success');
        } else {
          showToast('Invalid Coupon Code! Try HIMANSHU100 or TALWANA50', 'error');
        }
      };

      const cartSubtotal = cart.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      const deliveryFee = cartSubtotal > 500 || cartSubtotal === 0 ? 0 : 40;
      const finalTotal = Math.max(0, cartSubtotal + deliveryFee - appliedDiscount);

      const handleWhatsAppCheckout = () => {
        if (cart.length === 0) {
          showToast('Your shopping cart is empty!', 'error');
          return;
        }

        const orderRecord = {
          orderId: 'HS-' + Math.floor(100000 + Math.random() * 900000),
          date: new Date().toLocaleString(),
          items: cart,
          total: finalTotal,
          status: 'Order Placed on WhatsApp'
        };

        setMyOrders([orderRecord, ...myOrders]);

        let itemsListText = cart.map((item, idx) => `${idx + 1}. *${item.title}* (${item.weight}) - ${item.quantity} x ₹${item.price} = ₹${item.quantity * item.price}`).join('\n');
        
        const message = `*🛍️ NEW ORDER - HIMANSHU STORE (Talwana)*\n` +
          `----------------------------------------\n` +
          `*Order ID:* ${orderRecord.orderId}\n` +
          `*Customer Name:* ${currentUser.name}\n` +
          `*Mobile No:* +91 ${currentUser.mobile}\n` +
          `*Date:* ${orderRecord.date}\n\n` +
          `*Ordered Items:*\n${itemsListText}\n\n` +
          `----------------------------------------\n` +
          `*Subtotal:* ₹${cartSubtotal}\n` +
          `*Discount:* -₹${appliedDiscount}\n` +
          `*Delivery Charge:* ₹${deliveryFee === 0 ? 'FREE' : '₹' + deliveryFee}\n` +
          `*GRAND TOTAL PAYABLE:* *₹${finalTotal}*\n\n` +
          `*Delivery Address:* Talwana, Rajasthan\n` +
          `Please confirm my order and send estimated delivery time!`;

        const encodedMsg = encodeURIComponent(message);
        const whatsappUrl = `https://wa.me/919950091416?text=${encodedMsg}`;
        
        setCart([]);
        setShowCartDrawer(false);

        showToast('Redirecting to WhatsApp to complete your order...', 'success');
        window.open(whatsappUrl, '_blank');
      };

      const categories = ['All', 'Grocery & Cooking', 'Snacks & Sweets', 'Personal Care', 'Dairy & Fresh', 'Electronics'];
      
      const filteredProducts = products.filter(product => {
        const matchesCategory = selectedCategory === 'All' || product.category === selectedCategory;
        const matchesSearch = product.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              product.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCategory && matchesSearch;
      });


      // =========================================================================
      // CONDITION 1: USER NOT LOGGED IN -> SHOW STRICT FRONT PAGE OR AUTH GATE
      // =========================================================================
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-900 text-white flex flex-col justify-between selection:bg-amber-400 selection:text-slate-900">
            
            {/* Top Bar */}
            <header className="py-4 px-6 border-b border-slate-800 flex items-center justify-between max-w-7xl mx-auto w-full">
              <div className="flex items-center gap-3">
                <div className="bg-amber-400 text-slate-950 p-2.5 rounded-2xl font-black brand-font text-xl shadow-lg">
                  HS
                </div>
                <div>
                  <h1 className="text-xl md:text-2xl font-black brand-font text-white leading-none tracking-wide">
                    HIMANSHU STORE

            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-slate-200">
                <div className="bg-blue-600 text-white p-4 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icon name="orders" className="w-5 h-5" />
                    <h3 className="font-extrabold text-base brand-font">My Past Orders</h3>
                  </div>
                  <button onClick={() => setShowOrdersModal(false)} className="text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-4 max-h-96 overflow-y-auto space-y-3">
                  {myOrders.length === 0 ? (
                    <p className="text-center text-xs text-slate-400 py-8">You haven't placed any orders yet.</p>
                  ) : (
                    myOrders.map(order => (
                      <div key={order.orderId} className="p-3 bg-slate-50 rounded-xl border border-slate-200 space-y-1">
                        <div className="flex justify-between font-bold text-xs text-slate-800">
                          <span>Order #{order.orderId}</span>
                          <span className="text-blue-600">₹{order.total}</span>
                        </div>
                        <div className="text-[10px] text-slate-400">{order.date}</div>
                        <div className="text-xs font-semibold text-emerald-600 pt-1">{order.status}</div>
                      </div>
                    ))
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Owner Passcode Modal */}
          {showOwnerPasscodeModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full overflow-hidden shadow-2xl border border-slate-200">
                <div className="bg-slate-900 text-amber-400 p-5 text-center relative">
                  <div className="w-12 h-12 bg-amber-400/20 rounded-full flex items-center justify-center mx-auto mb-2 text-amber-400">
                    <Icon name="shield" className="w-6 h-6" />
                  </div>
                  <h3 className="font-extrabold text-lg brand-font text-white">Owner Access Gate</h3>
                  <p className="text-xs text-slate-400">Enter security passcode to open portal</p>
                  <button
                    onClick={() => setShowOwnerPasscodeModal(false)}
                    className="absolute top-4 right-4 text-slate-400 hover:text-white"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleOwnerPasscodeSubmit} className="p-6 space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1 text-center">
                      Owner Passcode
                    </label>
                    <input
                      type="password"
                      maxLength="6"
                      value={ownerPasscodeInput}
                      onChange={(e) => setOwnerPasscodeInput(e.target.value)}
                      placeholder="••••"
                      autoFocus
                      required
                      className="w-full text-center text-2xl font-black tracking-widest border border-slate-300 rounded-xl py-3 focus:ring-2 focus:ring-amber-400 focus:outline-none"
                    />
                    <p className="text-[11px] text-slate-400 text-center mt-1.5">
                      Hint: Passcode is <b>9950</b>
                    </p>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-amber-400 hover:bg-amber-300 text-blue-950 font-black py-3 rounded-xl text-sm shadow transition-all"
                  >
                    Unlock Owner Portal
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Owner Dashboard Overlay */}
          {showOwnerDashboard && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden shadow-2xl border border-slate-200">
                <div className="bg-slate-900 text-white p-5 flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="bg-amber-400 text-blue-950 p-2 rounded-xl font-bold">👑</div>
                    <div>
                      <h3 className="font-extrabold text-lg brand-font">Owner Management Portal</h3>
                      <p className="text-xs text-slate-400">Himanshu Store &bull; Talwana Dashboard</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowOwnerDashboard(false)}
                    className="p-1.5 hover:bg-slate-800 rounded-full text-slate-400 hover:text-white"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="flex border-b border-slate-200 bg-slate-50 px-5 pt-3">
                  <button
                    onClick={() => setOwnerTab('products')}
                    className={`px-5 py-2.5 font-bold text-xs md:text-sm rounded-t-xl transition-colors flex items-center gap-2 ${
                      ownerTab === 'products'
                        ? 'bg-white text-blue-600 border-t-2 border-blue-600 border-x border-slate-200'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="shoppingBag" className="w-4 h-4" />
                    <span>Manage Products ({products.length})</span>
                  </button>
                  <button
                    onClick={() => setOwnerTab('customers')}
                    className={`px-5 py-2.5 font-bold text-xs md:text-sm rounded-t-xl transition-colors flex items-center gap-2 ${
                      ownerTab === 'customers'
                        ? 'bg-white text-blue-600 border-t-2 border-blue-600 border-x border-slate-200'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    <Icon name="user" className="w-4 h-4" />
                    <span>Registered Customers ({registeredUsers.length})</span>
                  </button>
                </div>

                <div className="p-6 overflow-y-auto flex-1 space-y-6">
                  {ownerTab === 'products' && (
                    <div className="space-y-6">
                      <form onSubmit={handleAddProduct} className="bg-blue-50/60 p-5 rounded-2xl border border-blue-200 space-y-4">
                        <h4 className="font-extrabold text-blue-950 text-sm flex items-center gap-2">
                          <Icon name="plus" className="w-4 h-4 text-blue-600" />
                          <span>Add New Product to Store Catalog</span>
                        </h4>

                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 uppercase mb-1">Product Title</label>
                            <input
                              type="text"
                              value={newProduct.title}
                              onChange={(e) => setNewProduct({ ...newProduct, title: e.target.value })}
                              placeholder="e.g. Fortune Mustard Oil"
                              required
                              className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 uppercase mb-1">Category</label>
                            <select
                              value={newProduct.category}
                              onChange={(e) => setNewProduct({ ...newProduct, category: e.target.value })}
                              className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            >
                              <option>Grocery & Cooking</option>
                              <option>Snacks & Sweets</option>
                              <option>Personal Care</option>
                              <option>Dairy & Fresh</option>
                              <option>Electronics</option>
                            </select>
                          </div>

                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 uppercase mb-1">Weight / Unit</label>
                            <input
                              type="text"
                              value={newProduct.weight}
                              onChange={(e) => setNewProduct({ ...newProduct, weight: e.target.value })}
                              placeholder="e.g. 1 kg, 500 ml, 1 Pack"
                              className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 uppercase mb-1">MRP Price (₹)</label>
                            <input
                              type="number"
                              value={newProduct.mrp}
                              onChange={(e) => setNewProduct({ ...newProduct, mrp: e.target.value })}
                              placeholder="e.g. 150"
                              required
                              className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 uppercase mb-1">Selling Price (₹)</label>
                            <input
                              type="number"
                              value={newProduct.price}
                              onChange={(e) => setNewProduct({ ...newProduct, price: e.target.value })}
                              placeholder="e.g. 120"
                              required
                              className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs focus:ring-2 focus:ring-blue-500 focus:outline-none"
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-bold text-slate-700 uppercase mb-1">Product Photo / Camera</label>
                            <input
                              type="file"
                              accept="image/*"
                              capture="environment"
                              onChange={handleImageUpload}
                              className="w-full bg-white text-xs border border-slate-300 rounded-xl px-2 py-1.5 focus:outline-none"
                            />
                          </div>
                        </div>

                        <button
                          type="submit"
                          className="bg-blue-600 hover:bg-blue-700 text-white font-extrabold px-5 py-2.5 rounded-xl text-xs shadow transition-all flex items-center gap-2"
                        >
                          <Icon name="plus" className="w-4 h-4" />
                          <span>Publish Product to App</span>
                        </button>
                      </form>

                      <div className="space-y-3">
                        <h4 className="font-extrabold text-slate-800 text-sm">Store Catalog List</h4>
                        <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                          <table className="w-full text-left text-xs">
                            <thead className="bg-slate-100 text-slate-700 uppercase font-bold text-[10px]">
                              <tr>
                                <th className="p-3">Item</th>
                                <th className="p-3">Category</th>
                                <th className="p-3">MRP</th>
                                <th className="p-3">Selling Price</th>
                                <th className="p-3 text-right">Action</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200">
                              {products.map((item) => (
                                <tr key={item.id} className="hover:bg-slate-50">
                                  <td className="p-3 flex items-center gap-3">
                                    <img src={item.image} className="w-10 h-10 object-contain rounded bg-slate-50" />
                                    <div>
                                      <div className="font-bold text-slate-800">{item.title}</div>
                                      <div className="text-[10px] text-slate-400">{item.weight}</div>
                                    </div>
                                  </td>
                                  <td className="p-3 font-medium text-slate-600">{item.category}</td>
                                  <td className="p-3 text-slate-400 line-through">₹{item.mrp}</td>
                                  <td className="p-3 font-bold text-emerald-600">₹{item.price}</td>
                                  <td className="p-3 text-right">
                                    <button
                                      onClick={() => handleDeleteProduct(item.id, item.title)}
                                      className="p-1.5 text-rose-600 hover:bg-rose-50 rounded-lg font-bold"
                                      title="Delete Product"
                                    >
                                      <Icon name="trash" className="w-4 h-4" />
                                    </button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>
                  )}

                  {ownerTab === 'customers' && (
                    <div className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div className="bg-blue-50 border border-blue-200 p-4 rounded-2xl">
                          <div className="text-xs text-blue-700 font-bold uppercase">Total Registered Users</div>
                          <div className="text-3xl font-black text-blue-950 mt-1">{registeredUsers.length}</div>
                        </div>
                        <div className="bg-emerald-50 border border-emerald-200 p-4 rounded-2xl">
                          <div className="text-xs text-emerald-700 font-bold uppercase">Mobile OTP Verified</div>
                          <div className="text-3xl font-black text-emerald-950 mt-1">{registeredUsers.length}</div>
                        </div>
                      </div>

                      <div className="border border-slate-200 rounded-2xl overflow-hidden shadow-sm">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-100 text-slate-700 uppercase font-bold text-[10px]">
                            <tr>
                              <th className="p-3">Customer Name</th>
                              <th className="p-3">Mobile Number</th>
                              <th className="p-3">Email</th>
                              <th className="p-3">Signup Date & Time</th>
                              <th className="p-3">Status</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-200">
                            {registeredUsers.map((user) => (
                              <tr key={user.id} className="hover:bg-slate-50">
                                <td className="p-3 font-bold text-slate-800 flex items-center gap-2">
                                  <div className="w-6 h-6 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold text-[10px]">
                                    {user.name.charAt(0)}
                                  </div>
                                  <span>{user.name}</span>
                                </td>
                                <td className="p-3 font-semibold text-slate-700">+91 {user.mobile}</td>
                                <td className="p-3 text-slate-500">{user.email}</td>
                                <td className="p-3 text-slate-400">{user.signupDate}</td>
                                <td className="p-3">
                                  <span className="bg-emerald-100 text-emerald-800 font-bold text-[10px] px-2 py-0.5 rounded-full inline-flex items-center gap-1">
                                    <Icon name="check" className="w-3 h-3" /> Verified
                                  </span>
                                </td>
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-slate-900 text-slate-400 text-xs py-6 px-4 mt-12 border-t border-slate-800">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4 text-center md:text-left">
              <div>
                <h4 className="text-white font-extrabold text-sm brand-font">HIMANSHU STORE</h4>
                <p className="text-[11px] text-slate-500">Quality Products at Great Prices &bull; Talwana, Rajasthan</p>
              </div>
              <div>
                <p>&copy; 2026 Himanshu Store. All rights reserved.</p>
              </div>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
